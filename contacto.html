<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/custom-font.css">

    <script src="js/tailwindconfig.js"></script>
    <script src="//unpkg.com/alpinejs" defer></script>


</head>

<body>


    <header class="header fixed top-0 w-full md:mt-12  md:h-auto bg-white md:bg-transparent z-[99]">
        <div class="w-full md:w-[90%]  mx-auto flex  justify-between items-center">
            <div
                class="relative md:shadow-md bg-white flex flex-col md:flex-row md:gap-8 items-center rounded-auto md:rounded-full  md:px-12 w-full md:w-auto">
                <div
                    class="w-full md:w-auto h-[100px] md:h-[70px] px-6 md:px-0 flex items-center justify-between md:justify-center bg-gray-100 md:bg-white">
                    <a href="/"><img src="images/jm-logo.png" class="h-[35px]" alt="Johnson Miller"></a>
                    <button type="button"
                        class="openMenuMobile relative flex items-center justify-center md:hidden w-16 h-14 border-lg  rounded-2xl">
                        <span></span><span></span><span></span>
                    </button>
                </div>
                <div class="showMenuMobile bg-white w-full md:w-auto overflow-hidden">
                    <nav class="w-full md:w-auto ">
                        <ul class="flex gap:2 md:gap-8 flex-col md:flex-row  px-2 py-8 md:py-0 md:px-0">
                            <li><a href="/"
                                    class="text-md  p-4 md:py-auto w-full block rounded-lg transition transition-300 hover:bg-gray-200 md:hover:bg-white">Enfoque</a>
                            </li>
                            <li><a href="servicios.html"
                                    class="text-md  p-4 md:py-auto w-full block rounded-lg transition transition-300 hover:bg-gray-200 md:hover:bg-white">Servicios</a>
                            </li>
                            <li><a href="industrias.html"
                                    class="text-md  p-4 md:py-auto w-full block rounded-lg transition transition-300 hover:bg-gray-200 md:hover:bg-white">Industrias</a>
                            </li>
                            <li><a href="nosotros.html"
                                    class="text-md  p-4 md:py-auto w-full block rounded-lg transition transition-300 hover:bg-gray-200 md:hover:bg-white">Acerca
                                    de</a></li>
                        </ul>
                    </nav>
                    <div class=" flex md:hidden bg-white  items-center rounded-full h-[70px] px-4">
                        <a href="contacto.html"
                            class="w-full text-md  text-center transition transition-300 bg-[#e9791d] focus:bg-[#cc5b1e] text-white block px-10 h-[50px] leading-[50px] rounded-full ">Contacto</a>
                    </div>

                </div>

            </div>
            <div class="hidden md:shadow-md md:flex bg-white  items-center rounded-full h-[70px] px-4 ">
                <a href="contacto.html"
                    class="text-md bg-[#cc5b1e] text-white block px-10 h-[50px] leading-[50px] rounded-full transition transition-300 bg-[#e9791d] hover:bg-[#cc5b1e]">Contacto</a>
            </div>
        </div>

    </header>

    <section
        class="w-full h-[500px] bg-[url('./images/contact-us.png')] bg-cover bg-right md:bg-center flex items-center justify-center">


    </section>
    <section class="my-24">
        <div class="w-[90%] max-w-[800px] mx-auto">
            <div class="">
                <div class="">

                    <h1 class="text-6xl md:text-6xl font-dm font-bold mb-8 text-gray-800">Contacto</h1>


                    <div class="mb-4 mt-20">
                        <form action="">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                                <div>
                                    <label for="nombre" class="block mb-2 text-lg text-gray-800 font-semibold font-montserrat">Nombre(s)</label>
                                    <input type="text" id="nombre" class="w-full h-16 bg-gray-100 block rounded-3xl outline-none focus:outline-none focus:ring-0 px-8 focus:outline-none focus:ring-2 focus:ring-gray-300">
                                </div>
                                <div>
                                    <label for="apellido" class="block mb-2 text-lg text-gray-800 font-semibold font-montserrat">Apellidos</label>
                                    <input type="text" id="apellido" class="w-full h-16 bg-gray-100 block rounded-3xl outline-none focus:outline-none focus:ring-0 px-8 focus:outline-none focus:ring-2 focus:ring-gray-300">
                                </div>
                                <div>
                                    <label for="correo" class="block mb-2 text-lg text-gray-800 font-semibold font-montserrat">Correo</label>
                                    <input type="email" id="correo" class="w-full h-16 bg-gray-100 block rounded-3xl outline-none focus:outline-none focus:ring-0 px-8 focus:outline-none focus:ring-2 focus:ring-gray-300">
                                </div>
                                <div>
                                    <label for="telefono" class="block mb-2 text-lg text-gray-800 font-semibold font-montserrat">Teléfono</label>
                                    <input type="text" id="telefono" class="w-full h-16 bg-gray-100 block rounded-3xl outline-none focus:outline-none focus:ring-0 px-8 focus:outline-none focus:ring-2 focus:ring-gray-300">
                                </div>
                            </div>
                            <div class="mt-8">
                                <div class="w-full">
                                    <label for="texto" class="block mb-2 text-lg text-gray-800 font-semibold font-montserrat">¿Podemos ayudarte?</label>
                                    <textarea name="" id="texto" class="w-full h-[200px] bg-gray-100 resize-none block rounded-3xl outline-none focus:outline-none focus:ring-0 px-8 py-4 focus:outline-none focus:ring-2 focus:ring-gray-300"></textarea>
                                </div>
                            </div>
                            <div class="mt-8 flex justify-center">
                                <button type="button" class="rounded-full bg-[#e9791d] transition duration-300 hover:bg-[#cc5b1e] w-[400px] py-3 text-white text-lg font-bold font-dm ">ENVIAR</button>
                            </div>
                        </form>

                    </div>

                </div>


            </div>
        </div>
    </section>







    <footer class="bg-[#cc5b1e] mt-[80px]">
        <div class="w-[90%] max-w-[1250px] mx-auto flex justify-between items-center py-4">
            <span class="text-white">© Johnson Miller - 2026 Todos los derechos reservados</span>  
            <a href="politica-calidad.html" class="text-white hover:underline">Política de calidad</a>         
        </div>
    </footer>




    <script src="script.js"></script>
</body>

</html>
